apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-sec-filing-rag
  labels:
    app.kubernetes.io/part-of: sec-filing-rag
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sec-filing-rag-deploy-runner
  namespace: arc-runners-sec-filing-rag
automountServiceAccountToken: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outbound-only-runners
  namespace: arc-runners-sec-filing-rag
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: sec-filing-rag
      ports:
        - protocol: TCP
          port: 8080
