apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-filing-rag-probe
  labels:
    app.kubernetes.io/name: sec-filing-rag-probe
    app.kubernetes.io/part-of: sec-filing-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sec-filing-rag-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sec-filing-rag-probe
        app.kubernetes.io/part-of: sec-filing-rag
    spec:
      serviceAccountName: sec-filing-rag-probe
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: probe-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: sec-filing-rag-probe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sec-filing-rag-probe
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sec-filing-rag-probe
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sec-filing-rag.henrychan.dev
      secretName: cloudflare-origin-cert
  rules:
    - host: sec-filing-rag.henrychan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sec-filing-rag-probe
                port:
                  name: http
