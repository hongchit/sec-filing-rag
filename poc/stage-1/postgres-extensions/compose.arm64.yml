services:
  postgres:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: sec-filing-rag-poc-postgres-arm64:pg18.4-vector0.8.2-textsearch1.2.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the PoC-local env file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the PoC-local env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the PoC-local env file}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./tests:/poc/tests:ro
    networks:
      - postgres-net
    restart: "no"

volumes:
  postgres-data:

networks:
  postgres-net:
    internal: true
