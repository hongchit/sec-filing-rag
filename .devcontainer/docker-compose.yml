services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    env_file:
      - ../.env
    volumes:
      - ..:/workspaces/sec-filing-rag:cached
      - devcontainer-uv-cache:/home/vscode/.cache/uv
      - codex-home:/home/vscode/.codex
      - ${HOME}/.codex/skills/bootstrap-project:/home/vscode/.agents/skills/bootstrap-project:ro
    environment:
      UV_CACHE_DIR: /home/vscode/.cache/uv
      UV_LINK_MODE: copy

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres-data:/var/lib/postgresql

    # Add "forwardPorts": [5432] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  devcontainer-uv-cache:
    name: devcontainer-uv-cache
  codex-home:
  postgres-data:
