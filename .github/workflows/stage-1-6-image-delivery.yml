name: Stage 1.6 image delivery

on:
  pull_request:
    paths:
      - .github/workflows/stage-1-6-image-delivery.yml
      - .github/workflows/stage-1-6-deploy.yml
      - deploy/stage-1-6/**
      - poc/stage-1/image-delivery/**
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-1-6-image-delivery.yml
      - .github/workflows/stage-1-6-deploy.yml
      - deploy/stage-1-6/**
      - poc/stage-1/image-delivery/**

permissions:
  contents: read

concurrency:
  group: stage-1-6-image-delivery
  cancel-in-progress: false

jobs:
  test:
    name: Probe contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python 3.14.5
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: 3.14.5
          check-latest: false
      - name: Run dependency-free tests
        run: poc/stage-1/image-delivery/tests/run-tests.sh

  publish:
    name: Build and publish private GHCR image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      registry_digest: ${{ steps.validate.outputs.registry_digest }}
      deploy_digest: ${{ steps.validate.outputs.deploy_digest }}
      image_name: ${{ steps.identity.outputs.image_name }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive immutable image identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          printf 'image_name=ghcr.io/%s/sec-filing-rag-probe\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'image_version=sha-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Authenticate to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 and publish the full-commit tag
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: poc/stage-1/image-delivery
          file: poc/stage-1/image-delivery/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.image_name }}:${{ steps.identity.outputs.image_version }}
          build-args: |
            BUILD_DATE=${{ steps.identity.outputs.build_date }}
            BUILD_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.identity.outputs.image_version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Validate registry and amd64 deployment digests
        id: validate
        env:
          IMAGE_NAME: ${{ steps.identity.outputs.image_name }}
          IMAGE_VERSION: ${{ steps.identity.outputs.image_version }}
          REGISTRY_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw=$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${IMAGE_VERSION}")
          deploy_digest=$(jq -r \
            '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest // empty' \
            <<< "$raw")
          [[ -n "$deploy_digest" ]] || deploy_digest=$REGISTRY_DIGEST
          [[ "$deploy_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'registry_digest=%s\n' "$REGISTRY_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'deploy_digest=%s\n' "$deploy_digest" >> "$GITHUB_OUTPUT"
          printf 'Published index/manifest %s@%s; amd64 deployment digest %s\n' \
            "$IMAGE_NAME" "$REGISTRY_DIGEST" "$deploy_digest"
